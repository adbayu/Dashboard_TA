[platformio]
default_envs = satuan_ph, satuan_tmp, satuan_tds, paket_water

[board_config]
; Provisional classic ESP32 DevKit target; select the verified board here after Q6.
board = esp32dev

[env]
platform = espressif32@7.1.3
board = ${board_config.board}
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.4.3
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@4.0.6

[env:satuan_ph]
build_flags =
  -std=gnu++17
  -DJF_TYPE=\"AQ-PH\"
  -DJF_HAS_PH=1
  -DJF_HAS_TDS=0
  -DJF_HAS_TEMP=0

[env:satuan_tmp]
build_flags =
  -std=gnu++17
  -DJF_TYPE=\"AQ-TMP\"
  -DJF_HAS_PH=0
  -DJF_HAS_TDS=0
  -DJF_HAS_TEMP=1

[env:satuan_tds]
build_flags =
  -std=gnu++17
  -DJF_TYPE=\"AQ-TDS\"
  -DJF_HAS_PH=0
  -DJF_HAS_TDS=1
  -DJF_HAS_TEMP=0

[env:paket_water]
build_flags =
  -std=gnu++17
  -DJF_TYPE=\"AQ-WATER-01\"
  -DJF_HAS_PH=1
  -DJF_HAS_TDS=1
  -DJF_HAS_TEMP=1
  -DJF_HAS_TDS_POWER_SWITCH=1
