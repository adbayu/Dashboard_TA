<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Simpan secret key</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..500,0..1,0&amp;display=block">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;display:inline-block;vertical-align:middle;white-space:nowrap;letter-spacing:normal;text-transform:none;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.sk :focus-visible{outline:2px solid #2d6a4f;outline-offset:2px}
.sk{--ink:#191c1d;--ink2:#404943;--panel:#ffffff;--card-bd:rgba(15,82,56,.2);--inset:rgba(15,82,56,.05);--inset-bd:rgba(15,82,56,.22);--warn-bg:#fef3c7;--warn-fg:#78350f;--warn-bd:#fde68a;--code-bg:#191c1d;--code-fg:#e9eeea}
.sk.dark{--ink:#e9eeea;--ink2:#bac7be;--panel:#191e1b;--card-bd:rgba(255,255,255,.1);--inset:rgba(255,255,255,.06);--inset-bd:rgba(255,255,255,.12);--warn-bg:rgba(120,53,15,.4);--warn-fg:#fef3c7;--warn-bd:#92400e;--code-bg:#0c100e;--code-fg:#e9eeea}
.sk.dark :focus-visible{outline-color:#b1f0ce}

</style>
</helmet>
<div class="sk {{themeClass}}" style="width: 560px; height: 480px; box-sizing: border-box; padding: 24px; background: rgba(13,18,16,.45); display: flex; align-items: center; justify-content: center; font-family: 'Hanken Grotesk', sans-serif; color: var(--ink)">
<div role="dialog" aria-modal="true" aria-labelledby="judul-secret" style="width: 100%; box-sizing: border-box; background: var(--panel); border: 1px solid var(--card-bd); border-radius: 16px; box-shadow: 0 12px 40px -8px rgba(15,82,56,.25); padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="judul-secret" style="margin: 0; font-family: Manrope, sans-serif; font-size: 20px; font-weight: 800">Simpan key ini sekarang</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: var(--ink2)">Uji mitra · Test · devices:read, readings:read</p>
</div>
<p style="margin: 0; padding: 12px; border-radius: 12px; background: var(--warn-bg); border: 1px solid var(--warn-bd); color: var(--warn-fg); font-size: 13px; display: flex; gap: 8px"><span class="ms" aria-hidden="true" style="font-size: 18px">warning</span>Key ini tidak akan ditampilkan lagi. Kalau hilang, cabut lalu buat key baru.</p>
<div style="display: flex; gap: 8px; align-items: stretch">
<code style="flex: 1; min-width: 0; padding: 12px; border-radius: 10px; background: var(--code-bg); color: var(--code-fg); font-size: 13px; overflow-wrap: anywhere; user-select: all">jf_test_[64 karakter hex]</code>
<button type="button" onClick="{{copy}}" style="min-width: 96px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--inset-bd); background: var(--inset); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 18px">{{copyIcon}}</span>{{copyLabel}}</button>
</div>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{ack}}" onChange="{{toggleAck}}" style="accent-color: #0f5238; width: 18px; height: 18px">Sudah saya simpan di tempat aman</label>
<div style="display: flex; justify-content: flex-end; gap: 8px; align-items: center">
<sc-if value="{{locked}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 12px; color: var(--ink2)">Salin atau centang dulu untuk menutup.</span>
<span aria-disabled="true" style="height: 40px; padding: 0 16px; border-radius: 12px; background: #0f5238; opacity: 0.45; color: #ffffff; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center">Tutup</span>
</sc-if>
<sc-if value="{{unlocked}}" hint-placeholder-val="{{ false }}">
<a href="Developer.dc.html" style="height: 40px; padding: 0 16px; border-radius: 12px; background: #0f5238; color: #ffffff; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none">Tutup</a>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"gelap":{"editor":"boolean","default":false},"$preview":{"width":560,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const copied = !!this.state.copied;
    const ack = !!this.state.ack;
    return {
      themeClass: (this.props.gelap ?? false) ? 'dark' : '',
      copy: () => this.setState({ copied: true }),
      copyLabel: copied ? 'Tersalin' : 'Salin', copyIcon: copied ? 'check' : 'content_copy',
      ack, toggleAck: () => this.setState({ ack: !ack }),
      locked: !(copied || ack), unlocked: copied || ack
    };
  }
}
</script>
</body>
</html>
