services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot-local-only
      POSTGRES_DB: jagofarm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pilot_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d jagofarm"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailbox:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  pilot_database:
